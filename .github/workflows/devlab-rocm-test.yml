# Run colibri's HIP and Vulkan backends on consumer AMD GPUs.
#
# CI builds the HIP backend but never runs it, and the Vulkan suites run on
# Lavapipe (CPU). This runs both on a Radeon 8060S (Strix Halo, gfx1151) and a
# Radeon AI PRO R9700 (gfx1201): `make hip-test` built for the job's GPU, then
# the shader and staged Vulkan checks on RADV (one check per piece, .github/devlab-vk-checks.sh),
# in the stock ROCm container. Failures listed in .github/devlab-known-failures.txt are warnings.
#
# Every run uploads summary-*.json (which checks passed) so results compare
# across ROCm versions; other workflows call this one for a version matrix.
#
# Runners: AMD DevLab, a donated pool of ephemeral, single-use machines. One
# job per machine; nothing persists between jobs.
name: ROCm test (gfx1151, gfx1201)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: ROCm container to build and test in
        default: rocm/dev-ubuntu-24.04:7.2.4-complete
      rocm_sdk:
        description: 'Empty: the image''s ROCm. Else AMD''s pip ROCm SDK of this version spec (e.g. ==10.2.*) from the rc index'
        default: ''
  workflow_call:
    inputs:
      image: {type: string, default: rocm/dev-ubuntu-24.04:7.2.4-complete}
      label: {type: string, default: release}
      rocm_sdk: {type: string, default: ''}

permissions:
  contents: read

concurrency:
  group: rocm-test-${{ github.ref }}-${{ inputs.label || 'release' }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.gpu }} (${{ matrix.gfx }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - gpu: strix-halo
            gfx: gfx1151
          - gpu: radeon-r9700
            gfx: gfx1201
    runs-on: [self-hosted, Linux, devlab-dispatch, "${{ matrix.gpu }}"]
    timeout-minutes: 90
    env:
      IMAGE: ${{ inputs.image || 'rocm/dev-ubuntu-24.04:7.2.4-complete' }}
      LABEL: ${{ inputs.label || 'release' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in ${{ env.IMAGE }}
        env:
          GFX: ${{ matrix.gfx }}
          ROCM_SDK: ${{ inputs.rocm_sdk || '' }}
          TORCH_INDEX_MAP: ${{ vars.TORCH_INDEX_MAP }}
        run: |
          set -euo pipefail
          # AMD's rc index for the pip ROCm SDK, through the mirror when TORCH_INDEX_MAP (repository
          # variable, JSON: index URL -> mirror URL or [index, extra index, ...]) maps it.
          SDK_INDEX=https://rc.repo.amd.com/rocm/whl-next/ SDK_EXTRA=
          if [ -n "$ROCM_SDK" ] && [ -n "${TORCH_INDEX_MAP:-}" ]; then
            mapfile -t idx < <(python3 -c 'import json,sys; m=json.loads(sys.argv[1]); v=m.get(sys.argv[2], sys.argv[2]); print("\n".join([v] if isinstance(v, str) else v))' "$TORCH_INDEX_MAP" "$SDK_INDEX")
            # the SDK is in the mirror's core repository, the last of the list
            SDK_INDEX=${idx[-1]}; SDK_EXTRA="${idx[*]:0:${#idx[@]}-1}"
            echo "ROCm SDK index: $SDK_INDEX (extra: $SDK_EXTRA)"
          fi
          docker pull -q "$IMAGE"
          docker run --rm --network host --device=/dev/kfd --device=/dev/dri --group-add video --group-add render \
            --security-opt seccomp=unconfined -v "$PWD:/src" -w /src \
            -e GFX -e ROCM_SDK -e SDK_INDEX="$SDK_INDEX" -e SDK_EXTRA="$SDK_EXTRA" \
            "$IMAGE" bash /src/.github/devlab-container.sh
          cat results.txt

      - name: Judge results
        if: always()
        run: |
          python3 - <<'PY'
          import fnmatch, json, os
          known = []
          for line in open(".github/devlab-known-failures.txt"):
              line = line.strip()
              if line and not line.startswith("#"):
                  pat, reason, issue = [f.strip() for f in line.split("|", 2)]
                  known.append((pat, reason, issue))
          try:
              checks = dict(l.strip().split("=", 1) for l in open("results.txt") if "=" in l)
          except FileNotFoundError:
              checks = {}
          expected = ["setup", "hip-test", "vk-build", "vk-harness", "vk-harness-nocoop", "vk-tier", "vk-tier-host-pairs",
                      "glm53-f32", "glm53-f32-gemm-min-s0", "staged-tier", "staged-tier-noimport", "staged-chain"] + \
                     ["staged-harness-" + m for m in ("mapped", "staged", "staged-again", "staged-noimport", "window")]
          missing = [c for c in expected if c not in checks]
          kf, nf = [], []
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              for name, v in checks.items():
                  if v == "pass":
                      continue
                  # a program whose failing cases are named (<check>:<case>) is judged by those cases
                  if ":" not in name and any(k.startswith(name + ":") for k in checks):
                      continue
                  hit = next((k for k in known if fnmatch.fnmatch(name, k[0])), None)
                  if hit:
                      kf.append(name)
                      print(f"::warning title=Known upstream failure::{name} \u2014 {hit[1]} ({hit[2]})")
                      out.write(f"- known upstream failure: `{name}` \u2014 {hit[1]} ({hit[2]})\n")
                  else:
                      nf.append(name)
                      print(f"::error::new failure: {name}")
                      out.write(f"- NEW failure: `{name}`\n")
              for c in missing:
                  print(f"::error::check did not run: {c}")
                  out.write(f"- did not run: `{c}`\n")
          verdict = "fail" if nf or missing else "known-failures" if kf else "pass"
          json.dump({"verdict": verdict, "known_failures": kf, "new_failures": nf + missing}, open("judge.json", "w"))
          print("verdict:", verdict)
          raise SystemExit(verdict == "fail")
          PY

      - name: Write the run summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, datetime
          def read(p):
              try:
                  return open(p).read().strip()
              except Exception:
                  return None
          checks = dict(l.split("=", 1) for l in (read("results.txt") or "").splitlines() if "=" in l)
          passed = sum(v == "pass" for v in checks.values())
          try:
              judge = json.load(open("judge.json"))
          except Exception:
              judge = {"verdict": "fail", "known_failures": [], "new_failures": ["judge step did not run"]}
          summary = {
              "schema": 1, "project": "colibri", "label": os.environ["LABEL"],
              "release": "${{ github.sha }}"[:12], "combo": os.environ["IMAGE"],
              "gpu": "${{ matrix.gpu }}", "gfx": "${{ matrix.gfx }}",
              "env": {"arch": read("arch.txt"), "hip": read("hip.txt"), "image": os.environ["IMAGE"],
                      "rocm_sdk": read("rocm-sdk.txt")},
              "smoke": None, "checks": checks,
              "tests": {"ran": len(checks), "passed": passed, "failed": len(checks) - passed,
                        "errors": 0, "skipped": 0} if checks else None,
              "job_status": "${{ job.status }}",
              "verdict": judge["verdict"], "known_failures": judge["known_failures"],
              "new_failures": judge["new_failures"],
              "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "finished": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          json.dump(summary, open("summary.json", "w"), indent=1)
          print(json.dumps(summary, indent=1))
          PY

      - name: Upload the run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devlab-summary-${{ inputs.label || 'release' }}-${{ matrix.gpu }}-${{ github.run_attempt }}
          path: summary.json
          retention-days: 90

      - name: Upload the Vulkan logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devlab-vk-logs-${{ inputs.label || 'release' }}-${{ matrix.gpu }}-${{ github.run_attempt }}
          path: vk-logs
          retention-days: 30
          if-no-files-found: ignore
